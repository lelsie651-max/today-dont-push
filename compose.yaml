# 仅提供 PostgreSQL 本地开发数据库，不含任何业务服务
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: today_dont_push
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d today_dont_push"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
